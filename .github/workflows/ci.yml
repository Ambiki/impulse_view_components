name: CI

on:
  pull_request:
    branches:
      - main
  # A pull request can only restore the gem and yarn caches saved by its own runs or by main's, so runs on main save
  # them for every new pull request.
  push:
    branches:
      - main

# A new push to a pull request cancels the run still going for its previous push. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
      - name: Run ESLint
        run: |
          yarn install --frozen-lockfile
          yarn lint
      - name: Run typecheck
        # Also after ESLint fails, so both report their errors in one run.
        if: ${{ !cancelled() }}
        run: yarn typecheck

  check_exports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
      - name: Check package exports
        run: |
          yarn install --frozen-lockfile
          yarn build:prod
          yarn test:exports

  lint_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler: default
          bundler-cache: true
          rubygems: latest
      - name: Run rubocop
        run: ./bin/rubocop

  test_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The image comes with the browsers and the system packages they need, so the job doesn't install them from
    # Ubuntu's mirrors. Keep its version in step with `playwright` in yarn.lock. On a mismatch, `playwright install`
    # downloads the browsers that version needs.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
      - name: Run test
        run: |
          yarn install --frozen-lockfile
          yarn playwright install
          yarn test

  test_system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        gemfile:
          - rails_7_1
          - rails_8
        exclude:
          # Keep Ruby 4.0 limited to the newest Rails only
          - { ruby: "4.0", gemfile: rails_7_1 }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
      BUNDLE_PATH_RELATIVE_TO_CWD: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
      - run: |
          yarn install --frozen-lockfile
          yarn build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: default
          bundler-cache: true
          rubygems: latest
      - name: Run test
        run: bundle exec rake test:system
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: screenshots-ruby-${{ matrix.ruby }}-${{ matrix.gemfile }}
          path: demo/tmp/capybara/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  test_components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        gemfile:
          - rails_7_1
          - rails_8
        exclude:
          # Keep Ruby 4.0 limited to the newest Rails only
          - { ruby: "4.0", gemfile: rails_7_1 }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
      BUNDLE_PATH_RELATIVE_TO_CWD: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: default
          bundler-cache: true
          rubygems: latest
      - name: Run test
        run: bundle exec rake test:components

# The strings the calendars share. Month and weekday names come from Rails' `date.*` translations. The patterns are
# `strftime` patterns, formatted with `I18n.l`; the element formats the months it renders with the same ones, and knows
# only `%A %a %B %b %d %-d %e %m %Y %%`.
en:
  impulse:
    calendar:
      previous_month: Previous month
      next_month: Next month
      formats:
        # Names the displayed month, above the grid.
        heading: "%B %Y"
        # Each day's accessible name.
        day: "%A, %B %-d, %Y"

# The strings the calendars share. Month and weekday names come from Rails' `date.*` translations. The patterns are
# `strftime` patterns, formatted with `I18n.l`; the element formats the months it renders with the same ones, and knows
# only `%A %a %B %b %d %-d %e %m %Y %%`.
en:
  impulse:
    calendar:
      previous_month: Previous month
      next_month: Next month
      previous_year: Previous year
      next_year: Next year
      previous_decade: Previous decade
      next_decade: Next decade
      # Describe the heading's button, which drills up from days to months, and from months to years.
      choose_month: Choose a month
      choose_year: Choose a year
      formats:
        # Names the displayed month, above a calendar of days.
        month_heading: "%B %Y"
        # Each day's accessible name.
        day: "%A, %B %-d, %Y"
        # Each month's accessible name, in a month calendar or a calendar of days drilled up.
        month: "%B %Y"
        # Names the displayed decade, above a year calendar's grid. Rails interpolation, not strftime.
        decade: "%{start} – %{end}"
    week_calendar:
      # Describes the grid to screen readers, who can't see a week highlight as they move through the days.
      hint: Choosing a day chooses its week.
